<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>志校儿</title>
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 60px 20px;
    }
    #typewriter {
      font-size: 3rem;
      border-right: 3px solid #fff;
      white-space: nowrap;
      overflow: hidden;
      margin-bottom: 50px;
      animation: blink 0.7s step-end infinite;
    }
    @keyframes blink { 50% { border-color: transparent; } }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 900px;
    }
    .card {
      background: #111;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 30px 20px;
      text-align: center;
      text-decoration: none;
      color: #fff;
      transition: transform 0.2s, background 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .card:hover {
      transform: translateY(-4px);
      background: #1a1a1a;
      border-color: #666;
    }
    .card h3 { margin: 0 0 8px 0; font-size: 1.25rem; }
    .note { 
      font-size: 0.85rem; 
      color: #888; 
      margin: 0; 
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <h1 id="typewriter"></h1>

  <div class="grid">
    <a href="https://zhischooler-tts.pages.dev" class="card" target="_blank">
      <h3>语音生成站</h3>
    </a>
    <a href="https://zhischooler.github.io/zhixiaoer.github.io/" class="card" target="_blank">
      <h3>博客一站</h3>
    </a>
    <a href="https://zhi-xiaoxiao.github.io/zhi-xiaoer.github.io/" class="card" target="_blank">
      <h3>博客二站</h3>
    </a>
    <a href="https://github.com/Zhischooler" class="card" target="_blank">
      <h3>GitHub大号</h3>
    </a>
    <a href="https://github.com/Zhi-xiaoxiao" class="card" target="_blank">
      <h3>GitHub小号</h3>
    </a>
    <a href="https://space.bilibili.com/3706959322680215" class="card" target="_blank">
      <h3>哔哩哔哩</h3>
      <p class="note">催更请私信，有问题请私信</p>
    </a>
  </div>

  <script>
    const text = "志校儿";
    let i = 0;
    function type() {
      if (i < text.length) {
        document.getElementById("typewriter").textContent += text.charAt(i);
        i++;
        setTimeout(type, 300);
      }
    }
    window.onload = type;
  </script>
</body>
</html>
